#
# Phase 7 release lane: produce the self-contained desktop payload via
# tools/publish-release.ps1, code-sign it via SignPath (SignPath Foundation's
# free code signing for open-source projects), and attach it to a draft GitHub
# Release on a v* tag.
#
# Signing backend: SignPath, not Azure Artifact Signing. Azure Artifact
# Signing's identity validation is not available for an India-based
# maintainer, so this project uses SignPath instead — apply at
# https://signpath.io/solutions/open-source-community (public repo, OSI
# license, active development; manual review, ~1-2 weeks). The private key
# never leaves SignPath's infrastructure: CI uploads the unsigned zip as a
# build artifact and SignPath's action returns a signed one.
#
# Signing setup, once approved:
#   secrets:   SIGNPATH_API_TOKEN
#   variables: SIGNPATH_ORG_ID, SIGNPATH_PROJECT_SLUG,
#              SIGNPATH_SIGNING_POLICY_SLUG, SIGNPATH_CONNECTOR_URL
# See CONTRIBUTING.md for the full setup walkthrough.
#
# Distribution policy (decided 2026-09-12, see session-phase7.md): a fully
# gated signing path is preferred when configured. Until then, v* tags DO
# create a draft release with an UNSIGNED payload — an unsigned beta is better
# than no beta. The release notes state the signing status truthfully (see the
# "Compose release notes" step) and never claim "code-signed". TSD §12.1 was
# amended accordingly; the signed path becomes the distribution path once the
# signing secrets/variables exist.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version used in the artifact + release name"
        required: true
        default: "0.0.0-beta"
  push:
    tags:
      - 'v*'

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

permissions:
  contents: read

jobs:
  build-and-sign:
    name: Publish + sign desktop payload
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.sign-check.outputs.signed }}
      # The release notes name the asset, so they must use the SAME version
      # string the zip was built from -- the tag with its leading "v" stripped,
      # not github.ref_name. They disagreed, and the notes named a file that
      # was never in the release.
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $ver = "${{ github.ref_name }}" -replace '^v',''
          }
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "0.0.0-beta" }
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Is signing configured?
        id: sign-check
        shell: pwsh
        env:
          API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $configured = -not [string]::IsNullOrWhiteSpace($env:API_TOKEN)
          "signed=$($configured.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $configured) {
            Write-Warning "SIGNPATH_API_TOKEN is not set - building an UNSIGNED payload; the v* tag releases as an unsigned beta."
          }

      - name: Build native MuPDF shim
        shell: pwsh
        run: ./native/build-mupdf.ps1

      # The release notes tell the reader this build "passes the managed-build
      # lane ... before tagging". Nothing used to make that true: release.yml
      # triggers on a v* tag with no dependency on ci.yml and no required
      # status check, so tagging a red commit produced a draft release whose
      # notes asserted it had been tested.
      #
      # The suites run HERE, in the job that produces the payload, rather than
      # in a separate job: the native shim above is the expensive part and the
      # fidelity suite needs it, and a failing step fails this job, which
      # publish-release `needs`. So an untested payload cannot reach a release.
      - name: Build managed projects
        shell: pwsh
        run: |
          ./tools/build-managed.ps1 -Configuration Release -WarnAsError
          if ($LASTEXITCODE -ne 0) { throw "managed build failed (exit $LASTEXITCODE)" }

      - name: Test (the suites the release notes promise)
        shell: pwsh
        run: |
          # Each suite checked individually: a pwsh step takes its exit code
          # from the LAST command and a failing native command does not stop
          # the script, so a plain sequence would report only the final suite.
          # ci.yml records a real green-check-over-red-suite incident from
          # exactly this.
          $suites = @(
            'tests/PageForge.Core.Tests',
            'tests/PageForge.Fidelity.Tests',
            'tests/PageForge.Api.Tests')
          $failed = @()
          foreach ($s in $suites) {
            Write-Host "::group::dotnet test $s"
            dotnet test $s -c Release --no-build
            $code = $LASTEXITCODE
            Write-Host '::endgroup::'
            if ($code -ne 0) { $failed += "$s (exit $code)" }
          }
          if ($failed) { throw "release gate failed: $($failed -join ', ')" }

      # SignPath signs a zip as a whole (not an exe-in-place rewrite like
      # Azure's), so the payload is built and zipped UNSIGNED here regardless
      # of whether signing is configured.
      - name: Publish release payload (zipped, unsigned)
        shell: pwsh
        run: >
          powershell -ExecutionPolicy Bypass -File tools/publish-release.ps1
          -Version ${{ steps.ver.outputs.version }} -SkipApi

      - name: Upload unsigned payload for SignPath
        if: steps.sign-check.outputs.signed == 'true'
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: pageforge-unsigned
          path: artifacts/release/pageforge-${{ steps.ver.outputs.version }}-win-x64.zip
          if-no-files-found: error

      - name: Sign desktop payload (SignPath)
        if: steps.sign-check.outputs.signed == 'true'
        uses: SignPath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          connector-url: ${{ vars.SIGNPATH_CONNECTOR_URL }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          output-artifact-directory: artifacts/release/signed

      # SignPath returns a signed zip; verify the exe inside it with signtool
      # BEFORE it becomes the published asset. This is the equivalent of the
      # old -RequireSignature verify-before-zip gate, adapted to a signing
      # service that signs the whole zip rather than a staged folder — a
      # silently skipped or failed signing step can never ship as "signed".
      - name: Verify SignPath-signed payload
        if: steps.sign-check.outputs.signed == 'true'
        shell: pwsh
        run: |
          $signtool = & ./tools/find-signtool.ps1
          $signedZip = "artifacts/release/signed/pageforge-${{ steps.ver.outputs.version }}-win-x64.zip"
          if (-not (Test-Path $signedZip)) { throw "SignPath did not return the expected zip: $signedZip" }
          $verifyDir = "artifacts/release/verify"
          Expand-Archive -Path $signedZip -DestinationPath $verifyDir -Force
          $exe = Join-Path $verifyDir "PageForge.App.Wpf.exe"
          if (-not (Test-Path $exe)) { throw "signed payload missing PageForge.App.Wpf.exe" }
          & $signtool verify /pa /v $exe
          if ($LASTEXITCODE -ne 0) { throw "signature verification failed (unsigned or untrusted): $exe" }
          Write-Host "signature verified: $exe" -ForegroundColor Green
          # Replace the unsigned release asset with the verified signed one.
          Copy-Item $signedZip "artifacts/release/pageforge-${{ steps.ver.outputs.version }}-win-x64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: pageforge-release
          path: artifacts/release/*.zip
          if-no-files-found: error

  publish-release:
    name: Attach to GitHub Release (v* tag)
    runs-on: ubuntu-latest
    needs: [build-and-sign]
    permissions:
      contents: write # creating the release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pageforge-release
          path: artifacts/release

      - name: Compose release notes
        id: release-body
        shell: bash
        env:
          SIGNED: ${{ needs.build-and-sign.outputs.signed }}
          # Built from the same string publish-release.ps1 named the zip with.
          ASSET: pageforge-${{ needs.build-and-sign.outputs.version }}-win-x64.zip
        run: |
          {
            echo "PageForge release ${{ github.ref_name }}."
            echo ""
            echo "## Desktop"
            echo ""
            if [ "$SIGNED" = "true" ]; then
              echo "- \`$ASSET\` — self-contained (no runtime install needed), code-signed via SignPath."
            else
              echo "- \`$ASSET\` — self-contained (no runtime install needed). **Not code-signed in this build.**"
              echo ""
              echo "## Windows security prompts"
              echo ""
              echo "This beta is released unsigned, so Windows SmartScreen may show \"Windows protected your PC / Unknown publisher\", Microsoft Defender may quarantine the binary until you choose \"More info > Run anyway\", and Edge/Chrome may warn about the download. This is expected for an unsigned open-source beta and does not mean the file is malicious — cross-check the asset SHA-256 against this run's build output if you want extra assurance."
              echo ""
              echo "Signed builds with an established publisher identity will replace these warnings once SignPath signing is configured."
            fi
            echo ""
            echo "## Verification"
            echo ""
            echo "This release was produced by the \`release\` workflow. The payload attached here was built only after the Core, Fidelity and Api suites passed in the same job that produced it — the fidelity suite is the corpus render proof, so a rendering regression blocks the release rather than shipping in it. See CONTRIBUTING.md for the AGPL checklist and THIRD-PARTY-NOTICES.md for component licenses."
          } > release-body.md
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PageForge ${{ github.ref_name }}
          draft: true
          files: artifacts/release/*.zip
          body_path: release-body.md
