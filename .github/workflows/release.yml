#
# Phase 7 release lane: produce the self-contained desktop payload via
# tools/publish-release.ps1, code-sign it when a certificate is provided, and
# attach it to a GitHub Release (draft) when the run is triggered by a v* tag.
#
# Signing setup (repository secrets):
#   PAGEFORGE_CERT_PFX_B64    - base64 of the .pfx code-signing certificate.
#   PAGEFORGE_CERT_PASSWORD   - password for that .pfx.
# If those secrets are absent the payload is still built and uploaded as a build
# artifact, but it is NOT signed and no GitHub Release is created (a signed
# release is the Phase 7 exit gate).

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version used in the artifact + release name"
        required: true
        default: "0.0.0-beta"
  push:
    tags:
      - 'v*'

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build-and-sign:
    name: Publish + sign desktop payload
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build native MuPDF shim
        shell: pwsh
        run: ./native/build-mupdf.ps1

      - name: Publish release payload
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $ver = "${{ github.ref_name }}" -replace '^v',''
          }
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "0.0.0-beta" }
          powershell -ExecutionPolicy Bypass -File tools/publish-release.ps1 -Version $ver -SkipApi

      - name: Decode signing certificate
        id: decode-cert
        if: ${{ secrets.PAGEFORGE_CERT_PFX_B64 != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "pageforge.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PAGEFORGE_CERT_PFX_B64))
          Write-Host "cert decoded to $pfx"
          "pfx=$pfx" >> $env:GITHUB_OUTPUT

      - name: Sign desktop payload
        if: ${{ steps.decode-cert.outputs.pfx != '' }}
        shell: pwsh
        env:
          PAGEFORGE_CERT_PFX: ${{ steps.decode-cert.outputs.pfx }}
          PAGEFORGE_CERT_PASSWORD: ${{ secrets.PAGEFORGE_CERT_PASSWORD }}
          PAGEFORGE_TSA_URL: "http://timestamp.digicert.com"
        run: |
          # Re-run the publish script in sign mode: it signs the exe now that the
          # .pfx + password are present (see tools/publish-release.ps1 step 5).
          $ver = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $ver = "${{ github.ref_name }}" -replace '^v',''
          }
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "0.0.0-beta" }
          powershell -ExecutionPolicy Bypass -File tools/publish-release.ps1 -Version $ver -SkipApi

      - name: Upload build artifact (unsigned or signed preview)
        uses: actions/upload-artifact@v4
        with:
          name: pageforge-release
          path: artifacts/release/
          if-no-files-found: error

  publish-release:
    name: Attach to GitHub Release (signed v* tag only)
    runs-on: ubuntu-latest
    needs: [build-and-sign]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.PAGEFORGE_CERT_PFX_B64 != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pageforge-release
          path: artifacts/release
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PageForge ${{ github.ref_name }}
          draft: true
          files: artifacts/release/*.zip
          body: |
            PageForge release ${{ github.ref_name }}.

            ## Desktop
            - `pageforge-${{ github.ref_name }}-win-x64.zip` — self-contained
              (no runtime install needed), code-signed.

            ## Verification
            This release was produced by the `release` workflow and passes the
            managed-build lane (Core/Fidelity/Api tests + fidelity render proof)
            before tagging. See CONTRIBUTING.md for the AGPL checklist and
            THIRD-PARTY-NOTICES.md for component licenses.