#
# Phase 7 release lane: produce the self-contained desktop payload via
# tools/publish-release.ps1, code-sign it with Azure Artifact Signing (formerly
# Trusted Signing), and attach it to a draft GitHub Release on a v* tag.
#
# Signing setup — Azure Artifact Signing, via OIDC (no key material in GitHub):
#   secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   variables: AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT,
#              AZURE_CERT_PROFILE
# The app registration needs the "Trusted Signing Certificate Profile Signer"
# role on the signing account, and a federated credential for this repository.
# See CONTRIBUTING.md for the full setup walkthrough.
#
# Distribution policy (decided 2026-09-12, see session-phase7.md): Azure Artifact
# Signing remains the preferred, fully-gated path when configured. Until then,
# v* tags DO create a draft release with an UNSIGNED payload — an unsigned beta
# is better than no beta. The release notes state the signing status truthfully
# (see the "Compose release notes" step) and never claim "code-signed". TSD §12.1
# was amended accordingly; the signed path becomes the distribution path once the
# signing secrets/variables exist.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version used in the artifact + release name"
        required: true
        default: "0.0.0-beta"
  push:
    tags:
      - 'v*'

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

permissions:
  contents: read
  id-token: write # required for the OIDC login to Azure

jobs:
  build-and-sign:
    name: Publish + sign desktop payload
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.sign-check.outputs.signed }}
      # The release notes name the asset, so they must use the SAME version
      # string the zip was built from -- the tag with its leading "v" stripped,
      # not github.ref_name. They disagreed, and the notes named a file that
      # was never in the release.
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $ver = "${{ github.ref_name }}" -replace '^v',''
          }
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "0.0.0-beta" }
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Is signing configured?
        id: sign-check
        shell: pwsh
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          $configured = -not [string]::IsNullOrWhiteSpace($env:CLIENT_ID)
          "signed=$($configured.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $configured) {
            Write-Warning "AZURE_CLIENT_ID is not set - building an UNSIGNED payload; the v* tag releases as an unsigned beta."
          }

      - name: Build native MuPDF shim
        shell: pwsh
        run: ./native/build-mupdf.ps1

      # The release notes tell the reader this build "passes the managed-build
      # lane ... before tagging". Nothing used to make that true: release.yml
      # triggers on a v* tag with no dependency on ci.yml and no required
      # status check, so tagging a red commit produced a draft release whose
      # notes asserted it had been tested.
      #
      # The suites run HERE, in the job that produces the payload, rather than
      # in a separate job: the native shim above is the expensive part and the
      # fidelity suite needs it, and a failing step fails this job, which
      # publish-release `needs`. So an untested payload cannot reach a release.
      - name: Build managed projects
        shell: pwsh
        run: |
          ./tools/build-managed.ps1 -Configuration Release -WarnAsError
          if ($LASTEXITCODE -ne 0) { throw "managed build failed (exit $LASTEXITCODE)" }

      - name: Test (the suites the release notes promise)
        shell: pwsh
        run: |
          # Each suite checked individually: a pwsh step takes its exit code
          # from the LAST command and a failing native command does not stop
          # the script, so a plain sequence would report only the final suite.
          # ci.yml records a real green-check-over-red-suite incident from
          # exactly this.
          $suites = @(
            'tests/PageForge.Core.Tests',
            'tests/PageForge.Fidelity.Tests',
            'tests/PageForge.Api.Tests')
          $failed = @()
          foreach ($s in $suites) {
            Write-Host "::group::dotnet test $s"
            dotnet test $s -c Release --no-build
            $code = $LASTEXITCODE
            Write-Host '::endgroup::'
            if ($code -ne 0) { $failed += "$s (exit $code)" }
          }
          if ($failed) { throw "release gate failed: $($failed -join ', ')" }

      # Stage the payload but do NOT zip it yet: signing rewrites the .exe in
      # place, so the zip is built afterwards from the signed folder.
      - name: Publish release payload (staged, unzipped)
        shell: pwsh
        run: >
          powershell -ExecutionPolicy Bypass -File tools/publish-release.ps1
          -Version ${{ steps.ver.outputs.version }} -SkipApi -NoZip

      - name: Azure login (OIDC)
        if: steps.sign-check.outputs.signed == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign desktop payload (Azure Artifact Signing)
        if: steps.sign-check.outputs.signed == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\artifacts\release\PageForge-${{ steps.ver.outputs.version }}
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # -RequireSignature makes the script verify every shipped .exe with
      # `signtool verify /pa` BEFORE it builds the zip, so a signing step that
      # silently no-ops can never produce a published "signed" release.
      - name: Package signed payload
        if: steps.sign-check.outputs.signed == 'true'
        shell: pwsh
        run: >
          powershell -ExecutionPolicy Bypass -File tools/publish-release.ps1
          -Version ${{ steps.ver.outputs.version }} -SkipApi -ZipOnly -RequireSignature

      - name: Package unsigned payload
        if: steps.sign-check.outputs.signed != 'true'
        shell: pwsh
        run: >
          powershell -ExecutionPolicy Bypass -File tools/publish-release.ps1
          -Version ${{ steps.ver.outputs.version }} -SkipApi -ZipOnly

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: pageforge-release
          path: artifacts/release/*.zip
          if-no-files-found: error

  publish-release:
    name: Attach to GitHub Release (v* tag)
    runs-on: ubuntu-latest
    needs: [build-and-sign]
    permissions:
      contents: write # creating the release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pageforge-release
          path: artifacts/release

      - name: Compose release notes
        id: release-body
        shell: bash
        env:
          SIGNED: ${{ needs.build-and-sign.outputs.signed }}
          # Built from the same string publish-release.ps1 named the zip with.
          ASSET: pageforge-${{ needs.build-and-sign.outputs.version }}-win-x64.zip
        run: |
          {
            echo "PageForge release ${{ github.ref_name }}."
            echo ""
            echo "## Desktop"
            echo ""
            if [ "$SIGNED" = "true" ]; then
              echo "- \`$ASSET\` — self-contained (no runtime install needed), code-signed via Azure Artifact Signing."
            else
              echo "- \`$ASSET\` — self-contained (no runtime install needed). **Not code-signed in this build.**"
              echo ""
              echo "## Windows security prompts"
              echo ""
              echo "This beta is released unsigned, so Windows SmartScreen may show \"Windows protected your PC / Unknown publisher\", Microsoft Defender may quarantine the binary until you choose \"More info > Run anyway\", and Edge/Chrome may warn about the download. This is expected for an unsigned open-source beta and does not mean the file is malicious — cross-check the asset SHA-256 against this run's build output if you want extra assurance."
              echo ""
              echo "Signed builds with an established publisher identity will replace these warnings once Azure Artifact Signing is configured."
            fi
            echo ""
            echo "## Verification"
            echo ""
            echo "This release was produced by the \`release\` workflow. The payload attached here was built only after the Core, Fidelity and Api suites passed in the same job that produced it — the fidelity suite is the corpus render proof, so a rendering regression blocks the release rather than shipping in it. See CONTRIBUTING.md for the AGPL checklist and THIRD-PARTY-NOTICES.md for component licenses."
          } > release-body.md
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PageForge ${{ github.ref_name }}
          draft: true
          files: artifacts/release/*.zip
          body_path: release-body.md
