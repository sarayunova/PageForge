#
# Phase 0 CI skeleton. Three lanes:
#   1. native-build  : builds AGPL MuPDF + the PageForge shim via build-mupdf.ps1
#   2. managed-build : downloads the shim, builds + tests the managed solution, runs the fidelity
#                      render proof, byte-compares engine output against mutool.
#   3. winui-build   : builds the WinUI 3 shell (src/PageForge.App). Needs the UWP/MSIX MSBuild
#                      tasks that the windows-latest image provides; non-fatal in Phase 0 until
#                      the local/CI environment story is finalized (see AGENTS.md).

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  native-build:
    name: MuPDF native + shim
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build MuPDF + shim
        shell: pwsh
        run: ./native/build-mupdf.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: native-shim
          path: |
            native/out/PageForge.MuPdfShim/Release/pageforge_mupdf.dll
            native/out/_work/mupdf-1.28.3-source/platform/win32/x64/Release/mutool.exe

  managed-build:
    name: Managed build + tests + fidelity proof
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [native-build]
    env:
      # AGPL §13 source-offer: the /source endpoint must report the exact commit
      # running in production. The Api integration tests boot the host in-process,
      # so this is the value the deployed service would be launched with.
      PAGEFORGE_COMMIT_SHA: ${{ github.sha }}
      # The public repository the AGPL source offer points at. Derived from the
      # running repo so a fork advertises its own source, not upstream's.
      PAGEFORGE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      # The native lane always publishes the shim and tessdata to this job, so a
      # missing toolchain here is a real failure, not a reason to skip. Without
      # this the live-engine OCR tests return early and report as PASSED - which
      # is what they did on every CI run before the native lane went green.
      PAGEFORGE_REQUIRE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v8
        with:
          name: native-shim
          # The artifact is rooted at native/out (upload-artifact uses the least
          # common ancestor of the uploaded paths), so it must be unpacked there.
          # Unpacking into the shim directory nested the payload one level deeper
          # and the shim DLL could not be loaded.
          path: native/out
      - name: Restore + build managed projects (WinUI shell builds in its own lane)
        shell: pwsh
        run: |
          $managed = @(
            'src/PageForge.Core/PageForge.Core.csproj',
            'src/PageForge.MuPdfInterop/PageForge.MuPdfInterop.csproj',
            'src/PageForge.App.Wpf/PageForge.App.Wpf.csproj',
            'tests/PageForge.RenderSpike/PageForge.RenderSpike.csproj',
            'tests/PageForge.Core.Tests/PageForge.Core.Tests.csproj',
            'tests/PageForge.Fidelity.Tests/PageForge.Fidelity.Tests.csproj',
            'services/PageForge.Api/PageForge.Api.csproj',
            'tests/PageForge.Api.Tests/PageForge.Api.Tests.csproj')
          # Same trap as the Test step below: a failing dotnet build inside a
          # foreach neither stops the loop nor fails the step, so only the last
          # project's result would have been reported.
          foreach ($p in $managed) {
            dotnet build $p -c Release -warnaserror
            if ($LASTEXITCODE -ne 0) { throw "build failed for $p (exit $LASTEXITCODE)" }
          }
      - name: Test
        shell: pwsh
        run: |
          # Every suite must be checked individually. A pwsh step takes its exit
          # code from the LAST command, and a failing native command does not
          # stop the script, so listing `dotnet test` calls in sequence reports
          # only whether the final one passed. That is not hypothetical: run
          # 33817621227 shipped a green check while
          # PageForge.Fidelity.Tests had "Failed: 1, Passed: 47".
          $suites = @(
            'tests/PageForge.Core.Tests',
            'tests/PageForge.Fidelity.Tests',
            # Hosted-API suite includes the AGPL /source tests: the `/source`
            # endpoint honors AGPL-3.0-only and reports the deployed commit SHA.
            'tests/PageForge.Api.Tests')
          $failed = @()
          foreach ($s in $suites) {
            Write-Host "::group::dotnet test $s"
            dotnet test $s -c Release --no-build
            $code = $LASTEXITCODE
            Write-Host '::endgroup::'
            if ($code -ne 0) { $failed += "$s (exit $code)" }
          }
          if ($failed) {
            Write-Error "test suites failed:`n$($failed -join "`n")"
            exit 1
          }
          Write-Host "all $($suites.Count) test suites passed"
      - name: Render proof + engine/mutool byte-compare
        shell: pwsh
        run: |
          Remove-Item artifacts -Recurse -Force -ErrorAction SilentlyContinue
          & ./src/PageForge.App.Wpf/bin/Release/net8.0-windows/PageForge.App.Wpf.exe --smoke
          $mutool = Resolve-Path 'native/out/_work/mupdf-1.28.3-source/platform/win32/x64/Release/mutool.exe'
          dotnet run -c Release --project tests/PageForge.RenderSpike -- `
            tools/sample-pdf/sample-phase0.pdf --out artifacts --mutool-path $mutool
          # The fidelity claim this step exists to prove: PageForge's own render
          # of page 1 must be byte-identical to mutool's render of the same page.
          # Compare exactly those files.
          #
          # The previous check hashed EVERY png in artifacts/ and required all of
          # them to be equal, which can never hold - annot-phase1-p1.png and
          # edit-proof-p1.png are renders of deliberately MODIFIED pages and
          # differ by design. That logic had never executed, because no CI run
          # had ever reached this step.
          $reference = 'artifacts/sample-phase0-p1-mutool.png'
          $mustMatch = @(
            'artifacts/sample-phase0-p1-spike.png',   # engine render through the shim
            'artifacts/sample-phase0-p1-wpfproof.png' # same page through the WPF shell
          )
          foreach ($f in @($reference) + $mustMatch) {
            if (-not (Test-Path $f)) {
              Write-Error "expected render is missing: $f"
              exit 1
            }
          }
          $refHash = (Get-FileHash $reference -Algorithm SHA256).Hash
          $bad = foreach ($f in $mustMatch) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash
            if ($h -ne $refHash) { "  $f = $h" }
          }
          if ($bad) {
            Write-Error "renders differ from the mutool reference ($refHash):`n$($bad -join "`n")"
            exit 1
          }
          Write-Host "engine and WPF renders are byte-identical to mutool: $refHash"

  winui-build:
    name: WinUI shell build
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [managed-build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v8
        with:
          name: native-shim
          # The artifact is rooted at native/out (upload-artifact uses the least
          # common ancestor of the uploaded paths), so it must be unpacked there.
          # Unpacking into the shim directory nested the payload one level deeper
          # and the shim DLL could not be loaded.
          path: native/out
      - name: Build WinUI app
        shell: pwsh
        run: |
          # The WinUI spike needs the MSIX/PRI build tasks
          # (Microsoft.Build.Packaging.Pri.Tasks.dll). Those ship with Visual
          # Studio, not with the .NET SDK, so `dotnet build` can never find
          # them: it resolved against the runner's default SDK 10.0.400 and
          # failed with MSB4062 pointing at an AppxPackage folder that does not
          # exist. Build with Visual Studio's MSBuild instead, located the same
          # way the native build locates vcvars.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere not found at $vswhere" }
          $msbuild = & $vswhere -latest -products * `
            -requires Microsoft.Component.MSBuild `
            -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild.exe not found via vswhere' }
          Write-Host "using $msbuild"

          # Report whether the image actually carries the MSIX/PRI tasks, so a
          # failure here is diagnosable from the log without another round trip.
          # Must carry the same -requires filter as the lookup above: a bare
          # `-products *` also matches shell-based installs such as SQL Server
          # Management Studio, and would report on the wrong directory.
          $vsRoot = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild `
            -property installationPath | Select-Object -First 1
          Write-Host "VS install: $vsRoot"
          $priTask = Get-ChildItem $vsRoot -Recurse -Filter 'Microsoft.Build.Packaging.Pri.Tasks.dll' `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($priTask) { Write-Host "PRI tasks: $($priTask.FullName)" }
          else { Write-Host 'PRI tasks: NOT PRESENT in the Visual Studio install' }

          & $msbuild src/PageForge.App/PageForge.App.csproj -t:Restore `
            -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64
          if ($LASTEXITCODE -ne 0) { throw "restore failed (exit $LASTEXITCODE)" }
          & $msbuild src/PageForge.App/PageForge.App.csproj -t:Build `
            -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64
          if ($LASTEXITCODE -ne 0) { throw "build failed (exit $LASTEXITCODE)" }
