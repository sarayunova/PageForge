# PageForge local development infrastructure.
#
# Brings up the backing services the hosted API needs for local runs and the
# later slices (sync/versioning, billing). Start with:
#
#     docker compose up -d
#
# The API reads its connection string from appsettings.json; the defaults in
# that file match the Postgres service below (`postgres/postgres` on 5432,
# database `pageforge`).
#
# To reset all data:  docker compose down -v
services:
  postgres:
    image: postgres:16-alpine
    container_name: pageforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pageforge
    ports:
      - "5432:5432"
    volumes:
      - pageforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pageforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis is reserved for the sync/job-queue slices (Phase 4C onward). Provided
  # here so the local stack is complete as soon as those features land.
  redis:
    image: redis:7-alpine
    container_name: pageforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO (S3-compatible) is reserved for document-version blob storage
  # (FR-SYNC). Provided here so the local stack is complete for Phase 4C.
  minio:
    image: minio/minio:latest
    container_name: pageforge-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pageforge_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pageforge_pgdata:
  pageforge_minio: